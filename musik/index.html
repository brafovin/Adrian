<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROUGE – Musik in Rot &amp; Schwarz</title>
<meta name="description" content="ROUGE ist eine moderne Musik-Streaming-App in Rot und Schwarz – derzeit mit Demo-Inhalten.">
<meta name="theme-color" content="#09090a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROUGE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<div id="app">
  <main id="view" class="view" tabindex="-1"></main>
  <div id="mini-host" class="mini-host"></div>
  <div id="tab-host" class="tab-host"></div>
  <div id="auth" class="auth-layer" hidden></div>
  <div id="overlays"></div>
  <div id="toasts" aria-live="polite"></div>

  <div id="splash" class="splash" role="status" aria-label="ROUGE wird geladen">
    <div class="splash-inner">
      <svg class="splash-logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#e8112d"/>
        <circle class="logo-ring" cx="32" cy="32" r="18.5" fill="none" stroke="#fff" stroke-width="3.5" pathLength="100"/>
        <path class="logo-play" d="M28.5 23.5v17l14-8.5z" fill="#fff"/>
      </svg>
      <div class="splash-word">ROUGE</div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-error" id="splash-error" hidden></div>
    </div>
  </div>
</div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font-family:sans-serif;padding:2rem;text-align:center;z-index:200">ROUGE benötigt JavaScript.</p></noscript>
<script>
  // Hinweis, falls die App direkt per file:// geöffnet wurde (ES-Module brauchen einen Webserver).
  setTimeout(function () {
    if (window.__rougeBooted) return;
    var box = document.getElementById('splash-error');
    if (!box) return;
    box.hidden = false;
    box.textContent = location.protocol === 'file:'
      ? 'Bitte die App über einen Webserver öffnen (z. B. „python3 -m http.server“ im Projektordner).'
      : 'Die App konnte nicht gestartet werden. Bitte Seite neu laden.';
  }, 6000);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
