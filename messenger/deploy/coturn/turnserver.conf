# coturn für WebRTC-Anrufe hinter NAT/Firewalls. Das Secret wird per Kommandozeile (--static-auth-secret) gesetzt
# und muss mit TURN_SECRET der App übereinstimmen (zeitlich begrenzte Zugangsdaten, "TURN REST API").
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
no-multicast-peers
no-cli
min-port=49160
max-port=49200
# Zugriff auf interne Netze verbieten (SSRF-Schutz)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# Für TLS (turns:) Zertifikat von Caddy/Let's Encrypt einbinden:
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem
