name: kristallinsel
on:
  push: { paths: ['kristallinsel/**', '.github/workflows/kristallinsel.yml'] }
  pull_request: { paths: ['kristallinsel/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kristallinsel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
